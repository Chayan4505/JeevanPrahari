# Production Deployment Profile with Resource Constraints & Healthchecks
version: '3.8'

services:
  backend:
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    environment:
      SPRING_PROFILES_ACTIVE: prod

  ml-service:
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M
        reservations:
          cpus: '0.5'
          memory: 512M

  postgres:
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M

  redis:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
