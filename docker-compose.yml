version: '3.8'

services:
  # 1. PostgreSQL 16 with PostGIS Extension
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: pahaarsaathi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pahaarsaathi_db}
      POSTGRES_USER: ${POSTGRES_USER:-pahaarsaathi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pahaarsaathi_secure_pass_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/seed_ner_data.sql:/docker-entrypoint-initdb.d/01-seed.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pahaarsaathi_user} -d ${POSTGRES_DB:-pahaarsaathi_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pahaarsaathi-network

  # 2. Redis for Rate Limiting & Session Cache
  redis:
    image: redis:7.2-alpine
    container_name: pahaarsaathi-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - pahaarsaathi-network

  # 3. RabbitMQ Message Queue for Async Alert Fanout
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: pahaarsaathi-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pahaarsaathi-network

  # 4. MinIO S3-Compatible Object Storage for Incident Photos
  minio:
    image: minio/minio:RELEASE.2024-03-07T00-43-48Z
    container_name: pahaarsaathi-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - pahaarsaathi-network

  # 5. Python ML Microservice (FastAPI + XGBoost / Scikit-Learn)
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    image: pahaarsaathi-ml:1.2.0
    container_name: pahaarsaathi-ml
    restart: unless-stopped
    ports:
      - "${ML_PORT:-8000}:8000"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - pahaarsaathi-network

  # 6. Java Spring Boot Backend (Spring Security, JPA, CAP XML, RabbitMQ)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pahaarsaathi-backend:1.2.0
    container_name: pahaarsaathi-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pahaarsaathi_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-pahaarsaathi_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-pahaarsaathi_secure_pass_2026}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-guest}
      ML_SERVICE_URL: http://ml-service:8000
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: http://localhost:9000/pahaarsaathi-reports
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      JWT_SECRET: ${JWT_SECRET:-pahaarsaathi_ultra_secure_jwt_secret_key_ner_disaster_management_2026_x89}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-pahaarsaathi-demo-client-id.apps.googleusercontent.com}
      FAST2SMS_API_KEY: ${FAST2SMS_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - pahaarsaathi-network

  # 7. React Vite Frontend (Leaflet GIS, PWA, Recharts)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    image: pahaarsaathi-frontend:1.2.0
    container_name: pahaarsaathi-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - pahaarsaathi-network

  # 8. Nginx Reverse Proxy / Gateway
  nginx:
    image: nginx:alpine
    container_name: pahaarsaathi-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
      - ml-service
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - pahaarsaathi-network

networks:
  pahaarsaathi-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
