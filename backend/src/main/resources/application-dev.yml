spring:
  datasource:
    # Use H2 in-memory database for development (no PostgreSQL needed)
    url: jdbc:h2:mem:jeevenprahari_dev;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

  # Use simple in-memory Redis for development
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms

  # Use RabbitMQ (or disable if not available)
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

logging:
  level:
    com.jeevenprahari: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
